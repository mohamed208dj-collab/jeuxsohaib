<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سجل القراءة | رواياتي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:"Cairo",sans-serif;
            background:#030712;
            color:white;
            min-height:100vh;
            padding-bottom:90px;
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        /* ================= HEADER ================= */

        header{
            height:70px;
            padding:0 6%;

            display:flex;
            align-items:center;
            justify-content:space-between;

            position:sticky;
            top:0;
            z-index:100;

            background:rgba(3,7,18,.94);
            backdrop-filter:blur(18px);

            border-bottom:1px solid rgba(255,255,255,.07);
        }

        .logo{
            color:#3b82f6;
            font-size:24px;
            font-weight:800;
        }

        .header-actions{
            display:flex;
            gap:10px;
        }

        .header-btn{
            width:42px;
            height:42px;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:12px;

            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.08);

            font-size:18px;

            transition:.3s;
        }

        .header-btn:hover{
            background:#3b82f6;
            transform:translateY(-2px);
        }


        /* ================= CONTAINER ================= */

        .container{
            width:92%;
            max-width:900px;
            margin:auto;
            padding:35px 0;
        }


        /* ================= TITLE ================= */

        .page-title{
            margin-bottom:25px;
        }

        .page-title h1{
            font-size:30px;
            font-weight:800;
            margin-bottom:5px;
        }

        .page-title p{
            color:#9ca3af;
            font-size:13px;
        }


        /* ================= HISTORY CARD ================= */

        .history-card{
            display:flex;
            gap:20px;

            padding:18px;

            background:rgba(255,255,255,.035);

            border:1px solid rgba(255,255,255,.07);

            border-radius:20px;

            transition:.3s;
        }

        .history-card:hover{
            border-color:rgba(59,130,246,.4);

            box-shadow:
                0 15px 40px rgba(0,0,0,.3);

            transform:translateY(-3px);
        }


        /* ================= COVER ================= */

        .cover{
            width:145px;
            height:205px;

            object-fit:cover;

            border-radius:14px;

            flex-shrink:0;
        }


        /* ================= INFO ================= */

        .history-info{
            flex:1;

            display:flex;
            flex-direction:column;

            justify-content:center;
        }

        .badge{
            display:inline-block;

            width:max-content;

            padding:5px 10px;

            margin-bottom:10px;

            border-radius:20px;

            background:rgba(59,130,246,.1);

            border:1px solid rgba(59,130,246,.2);

            color:#60a5fa;

            font-size:10px;
        }

        .history-info h2{
            font-size:23px;
            font-weight:800;

            margin-bottom:6px;
        }

        .author{
            color:#9ca3af;
            font-size:12px;

            margin-bottom:15px;
        }


        /* ================= CHAPTER ================= */

        .chapter-box{
            padding:13px 15px;

            border-radius:13px;

            background:rgba(255,255,255,.035);

            border:1px solid rgba(255,255,255,.06);

            margin-bottom:15px;
        }

        .chapter-box small{
            color:#9ca3af;

            display:block;

            font-size:10px;

            margin-bottom:3px;
        }

        .chapter-box strong{
            font-size:14px;
        }


        /* ================= BUTTONS ================= */

        .buttons{
            display:flex;
            gap:9px;
            flex-wrap:wrap;
        }

        .btn{
            padding:10px 16px;

            border-radius:11px;

            font-size:11px;

            font-weight:700;

            transition:.3s;
        }

        .continue-btn{
            background:#3b82f6;
            color:white;
        }

        .continue-btn:hover{
            background:#2563eb;
        }

        .details-btn{
            background:rgba(255,255,255,.05);

            border:1px solid rgba(255,255,255,.08);

            color:#d1d5db;
        }

        .details-btn:hover{
            background:rgba(255,255,255,.1);
        }


        /* ================= DATE ================= */

        .date{
            margin-top:12px;

            color:#6b7280;

            font-size:10px;
        }


        /* ================= EMPTY ================= */

        .empty{
            display:none;

            text-align:center;

            padding:80px 20px;

            background:rgba(255,255,255,.025);

            border:1px solid rgba(255,255,255,.06);

            border-radius:20px;
        }

        .empty-icon{
            font-size:55px;

            margin-bottom:15px;
        }

        .empty h2{
            font-size:20px;

            margin-bottom:7px;
        }

        .empty p{
            color:#9ca3af;

            font-size:12px;

            margin-bottom:22px;
        }

        .browse-btn{
            display:inline-block;

            padding:11px 20px;

            background:#3b82f6;

            border-radius:12px;

            font-size:12px;

            font-weight:700;
        }


        /* ================= CLEAR ================= */

        .clear-box{
            display:none;

            margin-top:15px;

            text-align:left;
        }

        .clear-btn{
            border:none;

            background:rgba(239,68,68,.08);

            border:1px solid rgba(239,68,68,.15);

            color:#f87171;

            padding:9px 14px;

            border-radius:10px;

            font-family:"Cairo";

            font-size:10px;

            cursor:pointer;

        }


        /* ================= BOTTOM NAV ================= */

        .bottom-nav{
            position:fixed;

            bottom:0;
            left:0;

            width:100%;
            height:70px;

            display:flex;

            justify-content:space-around;
            align-items:center;

            background:rgba(3,7,18,.96);

            backdrop-filter:blur(18px);

            border-top:1px solid rgba(255,255,255,.07);

            z-index:200;
        }

        .nav-item{
            display:flex;

            flex-direction:column;

            align-items:center;

            gap:3px;

            color:#6b7280;

            font-size:10px;

            transition:.3s;
        }

        .nav-item span{
            font-size:19px;
        }

        .nav-item:hover,
        .nav-item.active{
            color:#3b82f6;
        }


        /* ================= RESPONSIVE ================= */

        @media(max-width:600px){

            .container{
                width:92%;
                padding-top:25px;
            }

            .page-title h1{
                font-size:25px;
            }

            .history-card{
                gap:13px;
                padding:13px;
            }

            .cover{
                width:105px;
                height:155px;
            }

            .history-info h2{
                font-size:17px;
            }

            .author{
                font-size:10px;
                margin-bottom:10px;
            }

            .chapter-box{
                padding:9px 11px;
                margin-bottom:10px;
            }

            .buttons{
                gap:6px;
            }

            .btn{
                padding:8px 11px;
                font-size:9px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <a href="index.html" class="logo">
        رواياتي.
    </a>

    <div class="header-actions">

        <a href="search.html" class="header-btn">
            🔍
        </a>

        <a href="library.html" class="header-btn">
            📚
        </a>

    </div>

</header>



<!-- ================= CONTENT ================= -->

<main class="container">


    <div class="page-title">

        <h1>
            سجل القراءة 📖
        </h1>

        <p>
            تابع من أين توقفت في آخر رواية قرأتها
        </p>

    </div>



    <!-- HISTORY -->

    <div
        class="history-card"
        id="historyCard">


        <img
            id="novelCover"
            class="cover"
            src=""
            alt="غلاف الرواية"
        >


        <div class="history-info">


            <span class="badge">
                آخر قراءة
            </span>


            <h2 id="novelTitle">
                —
            </h2>


            <p
                class="author"
                id="novelAuthor">
                —
            </p>


            <div class="chapter-box">

                <small>
                    توقفت عند
                </small>

                <strong id="chapterTitle">
                    —
                </strong>

            </div>


            <div class="buttons">

                <a
                    href="#"
                    id="continueBtn"
                    class="btn continue-btn">

                    ▶ متابعة القراءة

                </a>


                <a
                    href="#"
                    id="detailsBtn"
                    class="btn details-btn">

                    تفاصيل الرواية

                </a>

            </div>


            <div
                class="date"
                id="readDate">
                —
            </div>


        </div>

    </div>



    <!-- CLEAR -->

    <div
        class="clear-box"
        id="clearBox">

        <button
            class="clear-btn"
            onclick="clearHistory()">

            🗑 مسح سجل القراءة

        </button>

    </div>



    <!-- EMPTY -->

    <div
        class="empty"
        id="empty">

        <div class="empty-icon">
            📖
        </div>

        <h2>
            مازال ما قريتش أي رواية
        </h2>

        <p>
            ابدأ قراءة رواية الآن، وسيظهر آخر فصل قرأته هنا.
        </p>

        <a
            href="all-novels.html"
            class="browse-btn">

            اكتشف الروايات

        </a>

    </div>


</main>



<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <a
        href="index.html"
        class="nav-item">

        <span>⌂</span>

        الرئيسية

    </a>


    <a
        href="all-novels.html"
        class="nav-item">

        <span>📖</span>

        الروايات

    </a>


    <a
        href="search.html"
        class="nav-item">

        <span>🔍</span>

        البحث

    </a>


    <a
        href="history.html"
        class="nav-item active">

        <span>🕘</span>

        السجل

    </a>


    <a
        href="profile.html"
        class="nav-item">

        <span>👤</span>

        حسابي

    </a>

</nav>



<script>


/* ==================================================
   بيانات الروايات
================================================== */

const novels = [

    {
        id:1,
        title:"آخر ما تبقى مني",
        author:"أحمد الرواي",
        cover:"https://images.unsplash.com/photo-1512820790803-83ca734da794"
    },

    {
        id:2,
        title:"مدينة الرماد",
        author:"ليان نور",
        cover:"https://images.unsplash.com/photo-1500534623283-312aade485b7"
    },

    {
        id:3,
        title:"حينما ينام القمر",
        author:"سارة محمد",
        cover:"https://images.unsplash.com/photo-1499750310107-5fef28a66643"
    },

    {
        id:4,
        title:"ظل الماضي",
        author:"ياسين كاتب",
        cover:"https://images.unsplash.com/photo-1516979187457-637abb4f9353"
    },

    {
        id:5,
        title:"رسائل لم تصل",
        author:"نور الهدى",
        cover:"https://images.unsplash.com/photo-1455390582262-044cdead277a"
    }

];


/* ==================================================
   الحصول على سجل القراءة
================================================== */

const savedHistory =
    localStorage.getItem("lastRead");


/* ==================================================
   العناصر
================================================== */

const historyCard =
    document.getElementById("historyCard");

const empty =
    document.getElementById("empty");

const clearBox =
    document.getElementById("clearBox");


/* ==================================================
   إذا ماكانش تاريخ
================================================== */

if(!savedHistory){

    historyCard.style.display = "none";

    empty.style.display = "block";

}else{

    try{

        const history =
            JSON.parse(savedHistory);


        const novelId =
            Number(history.novel);


        const novel =
            novels.find(item =>
                item.id === novelId
            );


        if(!novel){

            historyCard.style.display = "none";

            empty.style.display = "block";

        }else{

            showHistory(
                history,
                novel
            );

        }

    }catch(error){

        historyCard.style.display = "none";

        empty.style.display = "block";

    }

}


/* ==================================================
   عرض آخر قراءة
================================================== */

function showHistory(history, novel){

    document.getElementById("novelCover").src =
        novel.cover +
        "?auto=format&fit=crop&w=600&q=80";


    document.getElementById("novelTitle").textContent =
        novel.title;


    document.getElementById("novelAuthor").textContent =
        "بقلم " + novel.author;


    document.getElementById("chapterTitle").textContent =
        "الفصل " + history.chapter;


    document.getElementById("continueBtn").href =
        `reader.html?novel=${novel.id}&chapter=${history.chapter}`;


    document.getElementById("detailsBtn").href =
        `novel.html?id=${novel.id}`;


    if(history.date){

        const date =
            new Date(history.date);


        document.getElementById("readDate").textContent =
            "آخر قراءة: " +
            date.toLocaleDateString(
                "ar-DZ",
                {
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            );

    }else{

        document.getElementById("readDate").textContent =
            "آخر قراءة";

    }


    clearBox.style.display = "block";

}


/* ==================================================
   مسح السجل
================================================== */

function clearHistory(){

    localStorage.removeItem("lastRead");

    historyCard.style.display = "none";

    clearBox.style.display = "none";

    empty.style.display = "block";

}

</script>

</body>

</html>
