<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Cairo",sans-serif;
    background:#030712;
    color:white;
    min-height:100vh;
    padding-bottom:90px;
}

a{
    text-decoration:none;
    color:inherit;
}

/* ================= HEADER ================= */

header{
    height:70px;
    padding:0 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:sticky;
    top:0;
    z-index:100;

    background:rgba(3,7,18,.94);
    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    color:#3b82f6;
    font-size:24px;
    font-weight:800;
}

.header-actions{
    display:flex;
    gap:10px;
}

.header-btn{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);

    font-size:18px;

    transition:.3s;
}

.header-btn:hover{
    background:#3b82f6;
    transform:translateY(-2px);
}


/* ================= CONTAINER ================= */

.container{
    width:92%;
    max-width:1100px;
    margin:auto;
    padding:35px 0;
}


/* ================= TITLE ================= */

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
    font-weight:800;
    margin-bottom:5px;
}

.page-title p{
    color:#9ca3af;
    font-size:13px;
}


/* ================= SEARCH ================= */

.search-wrapper{
    position:relative;
    margin-bottom:30px;
}

.search-wrapper input{
    width:100%;
    height:58px;

    padding:0 55px 0 20px;

    border-radius:16px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.09);

    outline:none;

    color:white;

    font-family:"Cairo";

    font-size:13px;

    transition:.3s;
}

.search-wrapper input:focus{
    border-color:#3b82f6;

    box-shadow:
        0 0 0 3px rgba(59,130,246,.08);
}

.search-icon{
    position:absolute;

    right:18px;
    top:50%;

    transform:translateY(-50%);

    font-size:20px;

    color:#60a5fa;

    pointer-events:none;
}

.clear-search{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    width:30px;
    height:30px;

    display:none;

    align-items:center;
    justify-content:center;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    color:#9ca3af;

    cursor:pointer;

    font-size:14px;
}


/* ================= QUICK ================= */

.quick-title{
    font-size:17px;
    font-weight:800;

    margin-bottom:13px;
}

.quick-searches{
    display:flex;
    gap:8px;

    overflow-x:auto;

    padding-bottom:5px;

    margin-bottom:30px;
}

.quick-searches::-webkit-scrollbar{
    display:none;
}

.quick-btn{
    white-space:nowrap;

    padding:8px 14px;

    border-radius:25px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.07);

    color:#9ca3af;

    font-family:"Cairo";

    font-size:11px;

    cursor:pointer;

    transition:.3s;
}

.quick-btn:hover{
    background:#3b82f6;
    border-color:#3b82f6;
    color:white;
}


/* ================= RESULTS HEADER ================= */

.results-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}

.results-header h2{
    font-size:19px;
    font-weight:800;
}

.results-header span{
    color:#60a5fa;
    font-size:11px;
}


/* ================= GRID ================= */

.novels-grid{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:18px;
}


/* ================= CARD ================= */

.novel-card{
    overflow:hidden;

    border-radius:17px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.07);

    transition:.35s;
}

.novel-card:hover{
    transform:translateY(-5px);

    border-color:
        rgba(59,130,246,.4);

    box-shadow:
        0 15px 35px rgba(0,0,0,.35);
}

.cover{
    width:100%;
    height:245px;

    object-fit:cover;

    display:block;
}

.card-content{
    padding:13px;
}

.category{
    display:inline-block;

    padding:4px 8px;

    border-radius:20px;

    background:rgba(59,130,246,.1);

    border:1px solid rgba(59,130,246,.18);

    color:#60a5fa;

    font-size:9px;

    margin-bottom:7px;
}

.novel-title{
    font-size:13px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:4px;
}

.author{
    color:#9ca3af;

    font-size:10px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:10px;
}

.details-btn{
    display:block;

    text-align:center;

    padding:8px;

    border-radius:9px;

    background:rgba(59,130,246,.1);

    color:#60a5fa;

    font-size:10px;

    font-weight:700;

    transition:.3s;
}

.details-btn:hover{
    background:#3b82f6;
    color:white;
}


/* ================= EMPTY ================= */

.empty{
    display:none;

    text-align:center;

    padding:70px 20px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.06);

    border-radius:20px;
}

.empty-icon{
    font-size:50px;

    margin-bottom:12px;
}

.empty h3{
    font-size:19px;

    margin-bottom:7px;
}

.empty p{
    color:#9ca3af;

    font-size:12px;
}


/* ================= INITIAL ================= */

.initial{
    text-align:center;

    padding:65px 20px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.06);

    border-radius:20px;
}

.initial-icon{
    font-size:50px;

    margin-bottom:12px;
}

.initial h3{
    font-size:19px;

    margin-bottom:7px;
}

.initial p{
    color:#9ca3af;

    font-size:12px;
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:0;

    width:100%;
    height:70px;

    display:flex;

    justify-content:space-around;
    align-items:center;

    background:rgba(3,7,18,.96);

    backdrop-filter:blur(18px);

    border-top:1px solid rgba(255,255,255,.07);

    z-index:200;
}

.nav-item{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:3px;

    color:#6b7280;

    font-size:10px;

    transition:.3s;
}

.nav-item span{
    font-size:19px;
}

.nav-item:hover,
.nav-item.active{
    color:#3b82f6;

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .novels-grid{
        grid-template-columns:

@media(max-width:750px){

        grid-template-columns:

@media(max-width:500px){

    .container{

    }

    .novels-grid{

    }

    .cover{
        height:220px;
    }

    .card-content{
        padding:10px;
    }

    .novel-title{
        font-size:12px;
    }

}

/* ==================================================

================================================== */

function performSearch(){

    const query =
        searchInput.value
        .trim()
        .toLowerCase();


    /* بدون بحث */

    if(query === ""){

        resultsSection.style.display = "none";

        initial.style.display = "block";

        clearButton.style.display = "none";

        return;

    }


    resultsSection.style.display = "block";

    initial.style.display = "none";

    clearButton.style.display = "flex";


    /* البحث في الاسم والكاتب والتصنيف */

    const results =
        novels.filter(novel => {

            return (

                novel.title
                .toLowerCase()
                .includes(query)

                ||

                novel.author
                .toLowerCase()
                .includes(query)

                ||

                novel.category
                .toLowerCase()
                .includes(query)

            );

        });


    resultCount.textContent =
        `${results.length} رواية`;


    /* لا توجد نتائج */

    if(results.length === 0){

        grid.innerHTML = "";

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    /* عرض النتائج */

    grid.innerHTML =
        results.map(novel => `

            <article class="novel-card">

                <a href="novel.html?id=${novel.id}">

                    <img
                        class="cover"
                        src="${novel.cover}?auto=format&fit=crop&w=600&q=80"
                        alt="${novel.title}"
                    >

                    <div class="card-content">

                        <span class="category">
                            ${novel.category}
                        </span>

                        <h3 class="novel-title">
                            ${novel.title}
                        </h3>

                        <p class="author">
                            بقلم ${novel.author}
                        </p>

                        <div class="details-btn">
                            عرض الرواية
                        </div>

                    </div>

                </a>

            </article>

        `).join("");

}


/* ==================================================
   البحث أثناء الكتابة
================================================== */

searchInput.addEventListener(
    "input",
    performSearch
);


/* ==================================================
   البحث السريع
================================================== */

function quickSearch(text){

    searchInput.value = text;

    performSearch();

    searchInput.focus();

}


/* ==================================================
   مسح البحث
================================================== */

function clearSearch(){

    searchInput.value = "";

    performSearch();

    searchInput.focus();

}


/* ==================================================
   تشغيل أولي
================================================== */

performSearch();

</script>
