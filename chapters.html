<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فصول الرواية | رواياتي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: #030712;
            color: white;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ================= HEADER ================= */

        header {
            height: 70px;
            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(3,7,18,0.9);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(255,255,255,0.07);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #3b82f6;
            font-size: 24px;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.08);

            font-size: 18px;

            transition: .3s;
        }

        .header-btn:hover {
            background: #3b82f6;
            transform: translateY(-2px);
        }


        /* ================= CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 950px;

            margin: auto;

            padding: 35px 0 110px;
        }


        /* ================= BACK ================= */

        .back {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            color: #9ca3af;

            margin-bottom: 25px;

            transition: .3s;
        }

        .back:hover {
            color: #3b82f6;
        }


        /* ================= NOVEL HEADER ================= */

        .novel-header {
            position: relative;

            overflow: hidden;

            padding: 30px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(17,24,39,.95),
                    rgba(15,23,42,.9)
                );

            border: 1px solid rgba(255,255,255,.08);

            margin-bottom: 25px;
        }

        .novel-header::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            background: #2563eb;

            filter: blur(140px);

            opacity: .1;

            top: -150px;
            right: -80px;
        }

        .novel-header-content {
            position: relative;

            display: flex;

            align-items: center;

            gap: 22px;
        }

        .cover {
            width: 105px;
            height: 150px;

            object-fit: cover;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,.08);

            box-shadow: 0 15px 35px rgba(0,0,0,.4);
        }

        .novel-info {
            flex: 1;
        }

        .category {
            display: inline-block;

            color: #60a5fa;

            background: rgba(59,130,246,.1);

            border: 1px solid rgba(59,130,246,.2);

            padding: 5px 12px;

            border-radius: 20px;

            font-size: 11px;

            margin-bottom: 9px;
        }

        .novel-title {
            font-size: 28px;

            font-weight: 800;

            margin-bottom: 5px;
        }

        .author {
            color: #9ca3af;

            font-size: 13px;

            margin-bottom: 12px;
        }

        .chapters-count {
            color: #60a5fa;

            font-size: 12px;
        }


        /* ================= CHAPTERS ================= */

        .section-title {
            font-size: 21px;

            font-weight: 800;

            margin-bottom: 15px;
        }

        .chapters-box {
            background: rgba(255,255,255,.025);

            border: 1px solid rgba(255,255,255,.07);

            border-radius: 20px;

            padding: 10px;
        }

        .chapter {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 17px 20px;

            border-radius: 13px;

            border-bottom: 1px solid rgba(255,255,255,.04);

            transition: .3s;
        }

        .chapter:last-child {
            border-bottom: none;
        }

        .chapter:hover {
            background: rgba(59,130,246,.09);

            transform: translateX(-3px);
        }

        .chapter-left {
            display: flex;

            align-items: center;

            gap: 13px;
        }

        .chapter-number {
            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background: rgba(59,130,246,.1);

            color: #60a5fa;

            font-size: 12px;

            font-weight: 700;
        }

        .chapter-name {
            font-size: 14px;

            font-weight: 600;
        }

        .chapter-status {
            color: #6b7280;

            font-size: 11px;
        }

        .arrow {
            color: #60a5fa;

            font-size: 18px;
        }


        /* ================= BUTTONS ================= */

        .actions {
            display: flex;

            gap: 10px;

            margin-top: 20px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 12px 18px;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 700;

            transition: .3s;
        }

        .primary {
            background: #3b82f6;
        }

        .primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .secondary {
            background: rgba(255,255,255,.05);

            border: 1px solid rgba(255,255,255,.08);
        }

        .secondary:hover {
            background: rgba(255,255,255,.1);
        }


        /* ================= ERROR ================= */

        .error {
            text-align: center;

            padding: 100px 20px;
        }

        .error-icon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        .error h2 {
            font-size: 25px;

            margin-bottom: 10px;
        }

        .error p {
            color: #9ca3af;

            margin-bottom: 20px;
        }


        /* ================= BOTTOM NAV ================= */

        .bottom-nav {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;

            height: 70px;

            display: flex;

            justify-content: space-around;

            align-items: center;

            background: rgba(3,7,18,.95);

            backdrop-filter: blur(18px);

            border-top: 1px solid rgba(255,255,255,.07);

            z-index: 200;
        }

        .nav-item {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 3px;

            color: #6b7280;

            font-size: 10px;

            transition: .3s;
        }

        .nav-item span {
            font-size: 19px;
        }

        .nav-item:hover {
            color: #3b82f6;
        }


        /* ================= RESPONSIVE ================= */

        @media(max-width:600px) {

            header {
                padding: 0 5%;
            }

            .container {
                width: 92%;

                padding-top: 25px;
            }

            .novel-header {
                padding: 20px;
            }

            .novel-header-content {
                gap: 15px;
            }

            .cover {
                width: 85px;
                height: 125px;
            }

            .novel-title {
                font-size: 21px;
            }

                font-size: 11px;
            }

            .chapter {
                padding: 14px 12px;
            }

            .chapter-number {
                width: 34px;
                height: 34px;
            }

            .chapter-name {
                font-size: 12px;
            }

            .chapter-status {
                font-size: 9px;
            }

            .arrow {
                font-size: 16px;
            }

        }

    </style>
</head>
