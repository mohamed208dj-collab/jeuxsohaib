<html lang="ar" dir="rtl">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: #030712;
            color: white;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== HEADER ===== */

        header {
            height: 70px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: rgba(3,7,18,0.85);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #3b82f6;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 19px;
            transition: 0.3s;
        }

        .header-btn:hover {
            background: #3b82f6;
            transform: translateY(-2px);
        }

        /* ===== PAGE ===== */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 35px 0 110px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .back:hover {
            color: #3b82f6;
        }

        /* ===== NOVEL HERO ===== */

        .novel-card {
            position: relative;
            overflow: hidden;
            border-radius: 25px;
            padding: 35px;
            background: linear-gradient(
                135deg,
                rgba(17,24,39,0.95),
                rgba(15,23,42,0.85)
            );
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .novel-card::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: #2563eb;
            filter: blur(150px);
            opacity: 0.12;
            top: -150px;
            right: -100px;
        }

        .novel-content {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
            align-items: start;
        }

        /* ===== COVER ===== */

        .cover-box {
            position: relative;
        }

        .cover {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 18px;
            display: block;
            box-shadow: 0 20px 45px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .status {
            position: absolute;
            top: 14px;
            right: 14px;
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        /* ===== INFO ===== */

        .category {
            display: inline-block;
            color: #60a5fa;
            background: rgba(59,130,246,0.12);
            border: 1px solid rgba(59,130,246,0.2);
            padding: 6px 13px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 42px;
            line-height: 1.35;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .author {
            color: #9ca3af;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .author span {
            color: #60a5fa;
            font-weight: 600;
        }

        /* ===== STATS ===== */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 18px;
            margin-bottom: 3px;
        }

        .stat span {
            color: #9ca3af;
            font-size: 12px;
        }

        .rating {
            color: #fbbf24;
        }

        /* ===== DESCRIPTION ===== */

        .description {
            color: #cbd5e1;
            line-height: 2;
            font-size: 15px;
            margin-bottom: 28px;
        }

        /* ===== BUTTONS ===== */

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 22px;
            border-radius: 13px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s;
        }

        .primary {
            background: #3b82f6;
            color: white;
        }

        .primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
        }

        .secondary:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        /* ===== CHAPTERS ===== */

        .section {
            margin-top: 35px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .chapters-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 20px;
            padding: 10px;
        }

        .chapter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 18px;
            border-radius: 13px;
            transition: 0.3s;
        }

        .chapter:hover {
            background: rgba(59,130,246,0.1);
        }

        .chapter-name {
            font-weight: 600;
        }

        .chapter-arrow {
            color: #60a5fa;
            font-size: 18px;
        }

        /* ===== SIMILAR ===== */

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .similar-card {
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
        }

        .similar-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59,130,246,0.4);
        }

        .similar-card img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
        }

        .similar-info {
            padding: 12px;
        }

        .similar-info h3 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .similar-info p {
            color: #9ca3af;
            font-size: 11px;
        }

        /* ===== BOTTOM NAV ===== */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(3,7,18,0.94);
            backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #6b7280;
            font-size: 11px;
            transition: 0.3s;
        }

        .nav-item span {
            font-size: 20px;
        }

        .nav-item:hover,
        .nav-item.active {
            color: #3b82f6;
        }

        /* ===== ERROR ===== */

        .error {
            text-align: center;
            padding: 100px 20px;
        }

        .error h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .error p {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        /* ===== RESPONSIVE ===== */

        @media (max-width: 800px) {

            .novel-content {
                grid-template-columns: 180px 1fr;
                gap: 25px;
            }

            .title {
                font-size: 30px;
            }

            .similar-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {

            header {
                padding: 0 5%;
            }

            .container {
                width: 92%;
                padding-top: 25px;
            }

            .novel-card {
                padding: 20px;
                border-radius: 20px;
            }

            .novel-content {
                grid-template-columns: 120px 1fr;
                gap: 18px;
            }

            .title {
                font-size: 22px;
            }

            .author {
                font-size: 13px;
                margin-bottom: 12px;
            }

            .category {
                font-size: 10px;
                padding: 4px 9px;
                margin-bottom: 8px;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 7px;
            }

            .stat {
                padding: 9px;
            }

            .stat strong {
                font-size: 14px;
            }

            .stat span {
                font-size: 10px;
            }

            .description {
                grid-column: 1 / -1;
                font-size: 13px;
                line-height: 1.9;
                margin-top: 5px;
            }

            .buttons {
                grid-column: 1 / -1;
            }

            .btn {
                flex: 1;
                min-width: 140px;
                font-size: 12px;
                padding: 11px 12px;
            }

            .similar-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

            "1543002588-bfa74002ed7e",
            "1544947950-fa07a98d237f",
            "1519682337058-a94d519337bc",
            "1507842217343-583bb7270b66"
        ][id % 6]}?auto=format&fit=crop&w=600&q=80`,

        description:
        `رواية ${item[0]} للكاتب ${item[1]}. حكاية مليئة بالأحداث والأسرار والمواقف التي ستأخذك في رحلة مختلفة من البداية حتى النهاية.`
    });

});


// قراءة ID من الرابط

const params = new URLSearchParams(window.location.search);

let id = parseInt(params.get("id"));

if (!id || id < 1 || id > 70) {
    id = 1;
}

const novel = novels.find(item => item.id === id);


// عرض الرواية

const container = document.getElementById("novelContainer");

if (novel) {

    document.title = novel.title + " | رواياتي";

    container.innerHTML = `

        <div class="novel-card">

            <div class="novel-content">

                <div class="cover-box">

                    <img
                        class="cover"
                        src="${novel.cover}"
                        alt="${novel.title}"
                    >

                    <div class="status">
                        ${novel.status}
                    </div>

                </div>


                <div>

                    <div class="category">
                        ${novel.category}
                    </div>

                    <h1 class="title">
                        ${novel.title}
                    </h1>

                    <div class="author">
                        بقلم <span>${novel.author}</span>
                    </div>


                    <div class="stats">

                        <div class="stat">
                            <strong class="rating">
                                ⭐ ${novel.rating}
                            </strong>
                            <span>التقييم</span>
                        </div>

                        <div class="stat">
                            <strong>
                                ${novel.chapters}
                            </strong>
                            <span>فصل</span>
                        </div>

                        <div class="stat">
                            <strong>
                                ${novel.status}
                            </strong>
                            <span>الحالة</span>
                        </div>

                    </div>


                    <p class="description">
                        ${novel.description}
                    </p>


                    <div class="buttons">

                        <a
                            href="reader.html?novel=${novel.id}&chapter=1"
                            class="btn primary"
                        >
                            ▶ ابدأ القراءة
                        </a>

                        <a
                            href="chapters.html?novel=${novel.id}"
                            class="btn secondary"
                        >
                            📖 الفصول
                        </a>

                    </div>

                </div>

            </div>

        </div>

    `;

}


// إنشاء الفصول

const chaptersBox = document.getElementById("chaptersBox");

if (novel) {

    let chaptersHTML = "";

    const visibleChapters = Math.min(novel.chapters, 8);

    for (let i = 1; i <= visibleChapters; i++) {

        chaptersHTML += `

            <a
                href="reader.html?novel=${novel.id}&chapter=${i}"
                class="chapter"
            >

                <span class="chapter-name">
                    الفصل ${i}
                </span>

                <span class="chapter-arrow">
                    ←
                </span>

            </a>

        `;

    }

    chaptersHTML += `

        <a
            href="chapters.html?novel=${novel.id}"
            class="chapter"
        >

            <span class="chapter-name">
                عرض جميع الفصول (${novel.chapters})
            </span>

            <span class="chapter-arrow">
                ←
            </span>

        </a>

    `;

    chaptersBox.innerHTML = chaptersHTML;

}


// روايات مشابهة

const similarGrid = document.getElementById("similarGrid");

const similar = novels
    .filter(item => item.id !== novel.id)
    .filter(item => item.category === novel.category)
    .slice(0, 4);

similarGrid.innerHTML = similar.map(item => `

    <a
        href="novel.html?id=${item.id}"
        class="similar-card"
    >

        <img
            src="${item.cover}"
            alt="${item.title}"
        >

        <div class="similar-info">

            <h3>
                ${item.title}
            </h3>

            <p>
                ${item.author}
            </p>

        </div>

    </a>

`).join("");


</script>

</body>
</html>
